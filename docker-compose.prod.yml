# Production: PostgreSQL + MQTT + API behind Caddy (automatic HTTPS).
#   cp deploy/env.production.example .env.production   # fill every value
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: selfx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: selfx
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U selfx"], interval: 10s, retries: 5 }

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    # no "ports:" on purpose – the broker is reachable only inside the Docker network
    volumes: ["./deploy/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro",
              "./deploy/mosquitto.acl:/mosquitto/config/acl:ro", "mqtt_users:/mosquitto/config/users"]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      SELFX_ENV: production
      SELFX_DATABASE_URL: postgresql+psycopg://selfx:${POSTGRES_PASSWORD}@db:5432/selfx
      SELFX_MQTT_HOST: mqtt
    volumes: ["firmware:/app/data/firmware", "./secrets:/secrets:ro"]
    depends_on: { db: { condition: service_healthy }, mqtt: { condition: service_started } }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    depends_on: [api]

volumes:
  pgdata:
  mqtt_users:
  firmware:
  caddy_data:
