# Production MQTT broker – no anonymous access, per-user topic rules, TLS only from outside.
# Create users once on the server (see DEPLOY.md):
#   docker compose -f docker-compose.prod.yml run --rm mqtt mosquitto_passwd -c /mosquitto/config/users/passwd selfx-api
#   docker compose -f docker-compose.prod.yml run --rm mqtt mosquitto_passwd /mosquitto/config/users/passwd SX-0001   (one per tracker)
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/users/passwd
acl_file /mosquitto/config/acl

# inside the Docker network only (the API's bridge)
listener 1883

# trackers from the internet: TLS only. Certificates: copy Caddy's (or Let's Encrypt) cert files to ./deploy/certs
# and open port 8883 in the firewall ONLY if trackers use MQTT (they use HTTPS by default).
#listener 8883
#certfile /mosquitto/certs/fullchain.pem
#keyfile /mosquitto/certs/privkey.pem
#tls_version tlsv1.2
